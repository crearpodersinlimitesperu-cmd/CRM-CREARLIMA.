<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1e293b; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div style="font-size: 10px; color: #4ade80;">Google SSO Module Loaded</div>
    <div id="g_id_onload"
         data-client_id="120359885148-qrt2t77u1bfoi7ic6duir7cuggl6mi2m.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" 
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <script>
        function sendMessageToStreamlit(type, data) {
            let msg = {
                isStreamlitMessage: true,
                type: type
            };
            if (data) {
                for (let key in data) {
                    msg[key] = data[key];
                }
            }
            window.parent.postMessage(msg, "*");
        }

        // Informar INMEDIATAMENTE a Streamlit que el componente está listo
        sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
        sendMessageToStreamlit("streamlit:setFrameHeight", {height: 80});

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            try {
                const payload = decodeJwtResponse(response.credential);
                sendMessageToStreamlit("streamlit:setComponentValue", {value: {email: payload.email, name: payload.name}});
            } catch (e) {
                console.error("Error decoding JWT", e);
            }
        }
    </script>
</body>
</html>
