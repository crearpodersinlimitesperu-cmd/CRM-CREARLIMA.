<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión IMO - CREAR (Conectado a NODUS)</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .glass-panel { background: white; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 2rem; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00E5FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 font-sans p-6 pb-24">

<div id="app-container" class="max-w-3xl mx-auto w-full">
    <!-- View Loading -->
    <div id="view-loading" class="flex flex-col items-center justify-center min-h-[50vh]">
        <div class="loader mb-4"></div>
        <p class="text-gray-500 font-bold">Conectando a Nodus en vivo...</p>
    </div>

    <!-- View 1: Selection -->
    <div id="view-selection" class="glass-panel border-t-4 border-[#00E5FF] w-full max-w-md mx-auto hidden">
        <div class="flex justify-center mb-6">
            <img src="logo.png" alt="CREAR" class="h-20 object-contain drop-shadow-lg">
        </div>
        <h2 class="text-2xl font-bold text-[#0A192F] mb-6 text-center">Selecciona tu perfil</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">1. Selecciona tu equipo</label>
            <select id="select-equipo" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-cyan-500">
                <option value="">Cargando equipos...</option>
            </select>
        </div>

        <div id="name-container" class="mb-6 hidden">
            <label class="block text-sm font-bold text-gray-700 mb-2">2. Ahora selecciona tu nombre</label>
            <select id="select-nombre" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-cyan-500">
                <option value="">-- Buscar por nombre --</option>
            </select>
        </div>

        <button id="btn-continuar" disabled class="w-full font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md bg-gray-300 text-gray-500 cursor-not-allowed">
            Continuar a mi Misión
        </button>
    </div>

    <!-- View 2: Mission -->
    <div id="view-mission" class="hidden">
        <div class="flex justify-center mb-6">
            <img src="logo.png" alt="CREAR" class="h-28 object-contain drop-shadow-lg">
        </div>
        
        <div class="bg-white rounded-xl shadow p-4 mb-6 sticky top-4 z-10 border-l-4 border-[#0A192F]">
            <div class="flex justify-between items-center">
                <div>
                    <h2 id="mission-imo-name" class="text-xl font-bold text-[#0A192F]">Cargando...</h2>
                    <p id="mission-imo-team" class="text-sm font-medium text-gray-500">Cargando...</p>
                </div>
                <div class="text-right">
                    <p class="text-sm font-bold text-gray-500 uppercase tracking-wider">Estado de Red</p>
                    <p id="sync-status" class="text-sm font-bold text-green-600">Sincronizado</p>
                </div>
            </div>
        </div>

        <div id="enrolados-list" class="space-y-4">
            <!-- Dynamic enrolados will be appended here -->
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCTMrA6A64s1ppDBBsol-fqam5Vch_Q5B0",
    authDomain: "centro-operativo-cpsl.firebaseapp.com",
    projectId: "centro-operativo-cpsl",
    storageBucket: "centro-operativo-cpsl.firebasestorage.app",
    messagingSenderId: "122588918051",
    appId: "1:122588918051:web:c85d6835b1b1f920fb1c96"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let misiones = [];
  let currentMission = null;
  let unsubscribe = null;

  const urlParams = new URLSearchParams(window.location.search);
  const activeImoId = urlParams.get('imoId');

  
  const auth = getAuth(app);
  async function loadData() {
    try {
      await signInAnonymously(auth);
      if(activeImoId) {

          // View Mission Mode
          unsubscribe = onSnapshot(doc(db, "imo_missions", activeImoId), (snap) => {
              if(snap.exists()) {
                  currentMission = { id: snap.id, ...snap.data() };
                  renderMission();
                  document.getElementById("view-loading").classList.add("hidden");
                  document.getElementById("view-mission").classList.remove("hidden");
              } else {
                  alert("La misión ya no existe o fue cerrada.");
                  window.location.href = "?";
              }
          });
      } else {
          // View Selection Mode
          const snap = await getDocs(collection(db, "imo_missions"));
          // Filtrar solo las misiones que digan Equipo 30
          
          // Detectar equipo desde la URL (ej. /imose30lima/ -> 30)
          const urlPath = window.location.pathname;
          let expectedTeamNumber = "30"; // default
          const match = urlPath.match(/e(\d+)/i);
          if(match) expectedTeamNumber = match[1];

          misiones = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.equipo && m.equipo.toUpperCase().includes(`EQUIPO ${expectedTeamNumber}`));

          
          const equiposSet = new Set(misiones.map(m => m.equipo));
          const equipos = Array.from(equiposSet).sort();
          
          const selEq = document.getElementById("select-equipo");
          selEq.innerHTML = '<option value="">-- Selecciona el equipo --</option>';
          equipos.forEach(eq => {
              selEq.innerHTML += `<option value="${eq}">${eq}</option>`;
          });
          
          document.getElementById("view-loading").classList.add("hidden");
          document.getElementById("view-selection").classList.remove("hidden");
      }
    } catch (e) {
      console.error("DEBUG FATAL:", e);
      document.getElementById("view-loading").innerHTML = '<p class="text-red-500 font-bold">Error conectando a Nodus: ' + e.message + '</p>';
    }
  }

  function renderMission() {
      if(!currentMission) return;
      document.getElementById("mission-imo-name").innerText = currentMission.imoNombre;
      document.getElementById("mission-imo-team").innerText = `${currentMission.equipo} • Tus enrolados de este fin de semana (${currentMission.totalEnrolados})`;
      
      const list = document.getElementById("enrolados-list");
      list.innerHTML = "";
      
      const checks = currentMission.checks || {};
      
      currentMission.enrolados.forEach(enrolado => {
          const asistencia = checks[enrolado.id]?.asistencia || false;
          const contacto = checks[enrolado.id]?.contacto || false;
          
          let estado = "Pendiente";
          let bgColor = "bg-white border-gray-200";
          let txtColor = "";
          
          if(asistencia && contacto) {
              estado = "Completo";
              bgColor = "bg-green-50 border-green-500";
              txtColor = "text-green-600";
          } else if(asistencia || contacto) {
              estado = "Parcial";
              bgColor = "bg-amber-50 border-amber-400";
              txtColor = "text-amber-600";
          }
          
          const div = document.createElement("div");
          div.className = `rounded-xl shadow-sm border-2 p-5 transition ${bgColor}`;
          div.innerHTML = `
              <h3 class="font-bold text-lg text-gray-800 mb-1">ENROLADO: ${enrolado.nombre}</h3>
              <p class="text-sm text-gray-600 mb-4">
                  <span class="font-semibold">COORDINADORA:</span> ${enrolado.coordinadora_nombre || 'N/A'} <br/>
                  <span class="font-semibold">NÚMERO:</span> ${enrolado.coordinadora_telefono || 'N/A'}
              </p>
              
              <a href="https://wa.me/${enrolado.coordinadora_telefono}?text=Hola, ${enrolado.coordinadora_nombre}. Soy ${currentMission.imoNombre}, del equipo ${currentMission.equipo}. Te escribo para asegurarme que mi enrolado ${enrolado.nombre} ya te contactó y confirmó su asistencia." target="_blank" class="inline-flex items-center justify-center w-full bg-[#00E5FF] hover:bg-cyan-500 text-[#0A192F] font-bold py-3 px-4 rounded-lg mb-6 transition shadow-sm uppercase tracking-wider text-sm">
                  Contactar Coordinadora
              </a>
              
              <div class="space-y-3">
                  <label class="flex items-start space-x-3 cursor-pointer p-2 hover:bg-black/5 rounded transition">
                      <input type="checkbox" class="check-asistencia w-6 h-6 text-[#00E5FF] rounded border-gray-300 mt-0.5" data-id="${enrolado.id}" ${asistencia ? 'checked' : ''}>
                      <span class="text-gray-800 font-medium leading-tight">Confirmo que mi enrolado asistirá al entrenamiento</span>
                  </label>
                  <label class="flex items-start space-x-3 cursor-pointer p-2 hover:bg-black/5 rounded transition">
                      <input type="checkbox" class="check-contacto w-6 h-6 text-[#00E5FF] rounded border-gray-300 mt-0.5" data-id="${enrolado.id}" ${contacto ? 'checked' : ''}>
                      <span class="text-gray-800 font-medium leading-tight">Garantizo que mi enrolado ya se comunicó con su coordinadora</span>
                  </label>
              </div>
              
              <div class="mt-4 pt-4 border-t border-gray-200/60 flex justify-between items-center text-xs text-gray-500">
                  <span class="font-bold uppercase tracking-wider">Estado: <span class="${txtColor}">${estado}</span></span>
              </div>
          `;
          list.appendChild(div);
      });
      
      // Attach events
      document.querySelectorAll(".check-asistencia").forEach(el => {
          el.addEventListener("change", (e) => updateCheck(e.target.dataset.id, "asistencia", e.target.checked));
      });
      document.querySelectorAll(".check-contacto").forEach(el => {
          el.addEventListener("change", (e) => updateCheck(e.target.dataset.id, "contacto", e.target.checked));
      });
  }

  async function updateCheck(enroladoId, field, value) {
      const syncStatus = document.getElementById("sync-status");
      syncStatus.innerText = "Guardando...";
      syncStatus.className = "text-sm font-bold text-amber-500";
      
      const updatedChecks = currentMission.checks || {};
      if(!updatedChecks[enroladoId]) updatedChecks[enroladoId] = {};
      updatedChecks[enroladoId][field] = value;
      
      // Calculate progres
      let completados = 0;
      currentMission.enrolados.forEach(en => {
         if(updatedChecks[en.id]?.asistencia && updatedChecks[en.id]?.contacto) {
             completados++;
         } 
      });
      
      const progreso = currentMission.totalEnrolados > 0 ? Math.round((completados / currentMission.totalEnrolados) * 100) : 0;
      
      try {
          await updateDoc(doc(db, "imo_missions", activeImoId), {
              checks: updatedChecks,
              completados: completados,
              progreso: progreso,
              lastUpdated: new Date().toISOString()
          });
          syncStatus.innerText = "Sincronizado";
          syncStatus.className = "text-sm font-bold text-green-600";
      } catch(e) {
          console.error(e);
          syncStatus.innerText = "Error de red";
          syncStatus.className = "text-sm font-bold text-red-600";
      }
  }

  document.getElementById("select-equipo").addEventListener("change", (e) => {
      const equipoSeleccionado = e.target.value;
      const selNombre = document.getElementById("select-nombre");
      const nameCont = document.getElementById("name-container");
      
      if (!equipoSeleccionado) {
          nameCont.classList.add("hidden");
          return;
      }
      
      nameCont.classList.remove("hidden");
      const imosDelEquipo = misiones.filter(m => m.equipo === equipoSeleccionado).sort((a,b) => a.imoNombre.localeCompare(b.imoNombre));
      
      selNombre.innerHTML = '<option value="">-- Buscar por nombre --</option>';
      imosDelEquipo.forEach(imo => {
          selNombre.innerHTML += `<option value="${imo.id}">${imo.imoNombre} (${imo.totalEnrolados} enrolados)</option>`;
      });
  });

  document.getElementById("select-nombre").addEventListener("change", (e) => {
      const btn = document.getElementById("btn-continuar");
      if(e.target.value) {
          btn.disabled = false;
          btn.classList.replace("bg-gray-300", "bg-[#00E5FF]");
          btn.classList.replace("text-gray-500", "text-[#0A192F]");
          btn.classList.remove("cursor-not-allowed");
          btn.classList.add("hover:bg-cyan-500");
      } else {
          btn.disabled = true;
          btn.classList.replace("bg-[#00E5FF]", "bg-gray-300");
          btn.classList.replace("text-[#0A192F]", "text-gray-500");
          btn.classList.add("cursor-not-allowed");
          btn.classList.remove("hover:bg-cyan-500");
      }
  });

  document.getElementById("btn-continuar").addEventListener("click", () => {
      const imoId = document.getElementById("select-nombre").value;
      if(imoId) {
          window.location.href = `?imoId=${imoId}`;
      }
  });

  loadData();
</script>
</body>
</html>
