<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado - {{ nombre }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --indigo-dark: #0a1738; 
            --gold-primary: #b8913e;
            --gold-gradient: linear-gradient(to right, #a37c27, #fdf6ba, #d4af37, #fdf6ba, #a37c27);
        }

        body {
            display: flex; justify-content: center; align-items: center;
            margin: 0; padding: 0;
            width: 297mm; height: 210mm;
            overflow: hidden;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            /* Usar la imagen hiperrealista generada por IA como fondo */
            background-image: url("{{ bg_path }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .content {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            /* Ajustamos el padding para no pisar los gruesos bordes del fondo */
            padding: 25mm 30mm;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            text-align: center;
        }

        .logo-container {
            height: 35mm; 
            margin-bottom: 5mm;
            display: flex; justify-content: center; align-items: center;
        }
        .logo-container img {
            max-height: 100%; max-width: 65mm; object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .main-title {
            font-family: 'Cinzel', serif; 
            font-size: 32pt; 
            font-weight: 700;
            color: var(--indigo-dark); 
            letter-spacing: 2px; 
            margin-bottom: 2mm;
        }

        .certifies {
            font-family: 'Cinzel', serif; 
            font-size: 16pt; 
            font-weight: 700;
            letter-spacing: 3px; 
            color: var(--indigo-dark); 
            margin-bottom: 6mm;
            text-transform: uppercase;
        }

        .name {
            font-family: 'Cinzel', serif; 
            font-size: 40pt; 
            font-weight: 800;
            color: var(--indigo-dark); 
            letter-spacing: 2px;
            margin-bottom: 6mm;
            border-bottom: 2px solid var(--indigo-dark);
            padding-bottom: 2mm;
            width: 85%;
        }

        .description {
            font-family: 'Playfair Display', serif; 
            font-size: 16pt; 
            font-weight: 400;
            color: var(--indigo-dark); 
            margin-bottom: 2mm;
        }

        .course-name {
            font-family: 'Great Vibes', cursive;
            font-size: 48pt; 
            font-weight: 400;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2mm;
            letter-spacing: 1px;
            filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.1));
            line-height: 1.2;
        }
        .course-name::before { content: '“'; font-family: serif; color: var(--gold-primary); -webkit-text-fill-color: var(--gold-primary); }
        .course-name::after { content: '”'; font-family: serif; color: var(--gold-primary); -webkit-text-fill-color: var(--gold-primary); }

        .team-details {
            font-family: 'Montserrat', sans-serif;
            font-size: 12pt;
            font-weight: 500;
            color: var(--indigo-dark);
            margin-bottom: 2mm;
        }

        .sub-details {
            font-family: 'Montserrat', sans-serif;
            font-size: 11pt;
            color: #444;
            margin-bottom: auto; /* Empuja la firma hacia abajo */
        }

        .signature-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15mm;
        }

        .signature-line {
            width: 65mm;
            border-bottom: 1.5px solid var(--indigo-dark);
            margin-bottom: 2mm;
        }

        .signature-name {
            font-family: 'Cinzel', serif; 
            font-size: 12pt; 
            font-weight: 700;
            color: var(--indigo-dark);
        }

        .signature-role {
            font-family: 'Montserrat', sans-serif; 
            font-size: 9pt; 
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-brand {
            position: absolute;
            bottom: 20mm;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif; 
            font-size: 12pt; 
            font-weight: 600;
            color: var(--indigo-dark); 
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo-container">
            <img src="{{ logo_path }}" alt="CREAR Logo">
        </div>
        
        <div class="main-title">CREAR Poder sin límites</div>
        <div class="certifies">CERTIFICA QUE</div>
        
        <div class="name">{{ nombre }}</div>
        
        <div class="description">Ha culminado su entrenamiento de rol <strong>{{ rol }}</strong> en</div>
        
        <div class="course-name">{{ curso }}</div>
        
        <div class="team-details">
            Equipo: <strong>{{ equipo }}</strong> | Número: <strong>{{ num_equipo }}</strong>
        </div>

        <div class="sub-details">
            Otorgado en {{ sede }}, del {{ fecha_inicio }} al {{ fecha_final }}.
        </div>

        <div class="signature-section">
            <div class="signature-line"></div>
            <div class="signature-name">{{ gerente_sede }}</div>
            <div class="signature-role">Gerente de Sede</div>
        </div>

        <div class="footer-brand">CREAR PODER SIN LÍMITES</div>
    </div>
</body>
</html>
