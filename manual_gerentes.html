## 2. Cómo Procesar y Subir los Vuelos de los Entrenadores

Para que un evento aparezca en verde (con logística resuelta) en el sistema, usted debe ingresar los tickets aéreos al sistema. Hay dos formas exactas de hacerlo:

### Opción A: Asignación Inmediata Web (Recomendada)
Vaya a la plataforma web y use la pestaña **"✈️ Vuelos"**.
👉 **[CLIC AQUÍ PARA ABRIR LA PLATAFORMA DE VUELOS](https://crearpodersinlimitesperu-cmd.github.io/CRM-CREARLIMA./calendario_global.html)**

**Paso a paso:**
1. Ingrese al enlace de arriba.
2. Haga clic en la pestaña **"✈️ Vuelos"** en el menú superior.
3. Haga clic en el botón azul grande **"Escanear Vuelos y Contratos PDF"**.
4. Seleccione los archivos PDF de las aerolíneas en su computadora.
5. El sistema leerá el texto del PDF automáticamente y lo emparejará con el entrenador y la sede correspondiente.

<div class="alert-tip">
<strong>💡 NUEVA HERRAMIENTA: ASIGNACIÓN MANUAL (SALVAVIDAS)</strong><br>
Si el sistema <strong>no reconoce</strong> automáticamente para quién es el boleto (porque el nombre en el PDF está muy diferente al del Excel), aparecerá en la pantalla una alerta amarilla: <strong>"Duda: Asignación Manual"</strong>.<br><br>
A la derecha de esa alerta, aparecerá un menú desplegable con todos los eventos del año. <strong>Solo elija el evento correcto de la lista y haga clic en ASIGNAR</strong>. El sistema forzará la conexión y quedará registrado. ¡Problema resuelto!
</div>

### Opción B: Inyección Vía Google Drive (Automática)
Si tiene muchos archivos y prefiere dejar que el bot los procese en segundo plano:
1. Descargue el PDF oficial de la aerolínea (Latam, Avianca, Copa, etc.).
2. **Asegúrese de que el PDF NO pida contraseña para abrirse.**
3. Ingrese a la carpeta oficial de la empresa:
   👉 **[CLIC AQUÍ PARA ABRIR LA CARPETA DE DRIVE DE VUELOS](https://drive.google.com/drive/folders/1oi7mUG619dQ2ZVzHzUyO5Xkwti-jgDFl?usp=drive_link)**
4. Arrastre el archivo allí. El robot pasará en un lapso de 10 minutos, lo leerá y actualizará el calendario.

## 3. Cómo Auditar el Calendario Global

El Command Center y Calendario es su radar principal para saber qué eventos faltan por cubrir logísticamente.

👉 **[CLIC AQUÍ PARA ABRIR EL CALENDARIO GLOBAL EN VIVO](https://crearpodersinlimitesperu-cmd.github.io/CRM-CREARLIMA./calendario_global.html)**

### Guía Exacta de Uso:
1. **Filtros Superiores (Sedes):** Verá botones fijos en el siguiente orden estricto: *QUITO C1, QUITO C2, GUAYAQUIL, LIMA, CUENCA, MEDELLÍN, MÉXICO*. Al hacer clic en uno, limpiará la pantalla para mostrar solo esa plaza.
2. **Tarjetas de Evento (El Semáforo):** 
   - Si la tarjeta muestra el nombre del entrenador y abajo dice <span style="color:#ef4444; font-weight:bold;">"Sin Ticket"</span>, significa que usted debe actuar urgentemente y conseguir/subir ese vuelo.
   - Si la tarjeta tiene un **check verde**, la logística está completa y el PNR ya está en el sistema.
3. **El Buscador:** Use la barra de búsqueda en la parte superior para escribir el nombre de un entrenador (ej. "Paul"). La pantalla filtrará instantáneamente todos sus viajes programados en todas las sedes para el año en curso.
