<!DOCTYPE html>
<html lang="en">
<head>

    <title>Windows Performance Engine - Diagnostic Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: -webkit-linear-gradient(#60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), 0 0 15px var(--accent-glow);
        }
        .card h2 {
            font-size: 1.25rem;
            color: var(--accent);
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 600; text-align: right; word-break: break-all; max-width: 60%;}
        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .bg-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
        .bg-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid var(--success); }
        .bg-warning { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid var(--warning); }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
        }
        
        pre {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            overflow-x: auto;
            color: #a78bfa;
            white-space: pre-wrap;
        }
    </style>
</head>

        function getStatusColor(percent) {
            if(percent > 90) return "var(--danger)";
            if(percent > 70) return "var(--warning)";
            return "var(--success)";
        }

        function createCard(title, content) {
            return `<div class="card">
                <h2>${title}</h2>
                ${content}
            </div>`;
        }

        function renderStat(label, value) {
            return `<div class="stat"><span class="stat-label">${label}</span><span class="stat-value">${value}</span></div>`;
        }

        const container = document.getElementById("dashboard");
        let html = "";

        // 1. Machine Identity
        if(rawData.machine_identity) {
            const id = rawData.machine_identity;
            let c = renderStat("OS", id.WindowsEdition + " (" + id.Build + ")");
            c += renderStat("Modelo", id.Manufacturer + " " + id.Model);
            c += renderStat("Placa Base", id.MotherboardManufacturer + " " + id.Motherboard);
            c += renderStat("Secure Boot", id.SecureBootState === 1 ? "<span class='badge bg-success'>ACTIVO</span>" : "<span class='badge bg-danger'>INACTIVO</span>");
            html += createCard("System Identity", c);
        }

        // 2. CPU
        if(rawData.cpu_forensics) {
            const cpu = rawData.cpu_forensics;
            let c = renderStat("Procesador", cpu.Name);
            c += renderStat("Nucleos / Hilos", cpu.Cores + " / " + cpu.Threads);
            c += renderStat("Carga Actual", cpu.Load + "%");
            c += `<div class="progress-bar"><div class="progress-fill" style="width: ${cpu.Load}%; background: ${getStatusColor(cpu.Load)}"></div></div>`;
            html += createCard("CPU Telemetry", c);
        }

        // 3. RAM
        if(rawData.ram_forensics) {
            const ram = rawData.ram_forensics;
            let c = renderStat("Fisica Total", ram.TotalPhysicalMB + " MB");
            c += renderStat("Fisica Libre", ram.FreePhysicalMB + " MB");
            c += renderStat("Uso Actual", ram.PercentUsed + "%");
            c += `<div class="progress-bar"><div class="progress-fill" style="width: ${ram.PercentUsed}%; background: ${getStatusColor(ram.PercentUsed)}"></div></div>`;
            if(ram.PercentUsed > 90) {
                c += `<br><span class="badge bg-danger">PRESION CRITICA DE RAM</span>`;
            }
            html += createCard("Memoria RAM", c);
        }
        
        // 4. GPU
        if(rawData.gpu_forensics) {
            const gpu = rawData.gpu_forensics;
            let c = renderStat("Graficos", gpu.Name);
            c += renderStat("Controlador", gpu.DriverVersion);
            c += renderStat("RAM Compartida", (gpu.AdapterRAM / 1024 / 1024).toFixed(0) + " MB");
            html += createCard("GPU / Graficos", c);
        }

        // 5. Storage
        if(rawData.storage_forensics && rawData.storage_forensics.Volumes) {
            let c = "";
            const vols = Array.isArray(rawData.storage_forensics.Volumes) ? rawData.storage_forensics.Volumes : [rawData.storage_forensics.Volumes];
            vols.forEach(v => {
                if(v.DriveLetter && v.FileSystem === "NTFS") {
                    const sizeGB = (v.Size / 1024/1024/1024).toFixed(1);
                    const freeGB = (v.SizeRemaining / 1024/1024/1024).toFixed(1);
                    const usedPct = ((v.Size - v.SizeRemaining) / v.Size * 100).toFixed(1);
                    
                    c += renderStat("Disco " + v.DriveLetter + ":", freeGB + " GB libres de " + sizeGB + " GB");
                    c += `<div class="progress-bar"><div class="progress-fill" style="width: ${usedPct}%; background: ${getStatusColor(usedPct)}"></div></div><br>`;
                }
            });
            html += createCard("Almacenamiento", c);
        }

        // 7. Health Events
        if(rawData.windows_health) {
            let c = "<pre>";
            const events = Array.isArray(rawData.windows_health) ? rawData.windows_health : [rawData.windows_health];
            events.slice(0, 3).forEach(e => {
                c += `[${e.ProviderName}] ${e.Message.substring(0, 90)}...\n\n`;
            });
            c += "</pre>";
            html += createCard("Errores Criticos (Event Viewer)", c);
        }

        container.innerHTML = html;
    </script>
