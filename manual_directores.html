## 2. Gestión de Vuelos Logísticos

**¿Dónde subir los vuelos para automatización?**
Usted, al igual que los gerentes, tiene acceso a la carpeta maestra de inyección. Para que el bot lea y empareje los vuelos automáticamente con el calendario, deposite los PDFs de las aerolíneas en:

👉 **[CLIC AQUÍ PARA ABRIR LA CARPETA DE VUELOS DE ENTRENADORES](https://drive.google.com/drive/folders/1oi7mUG619dQ2ZVzHzUyO5Xkwti-jgDFl?usp=drive_link)**

### Pasos para Subir Vuelos Automáticamente:
1. Descargue el PDF oficial de la aerolínea (Latam, Avianca, Copa, etc.).
2. **Asegúrese de que el PDF NO tenga contraseña** (si tiene clave, ábralo e imprímalo nuevamente como PDF sin clave).
3. Arrastre el archivo dentro de la carpeta de Google Drive mencionada arriba.
4. ¡Listo! En el próximo ciclo del sistema (10 minutos máximo), el bot leerá el PDF, extraerá el código PNR, buscará al entrenador en la **Hoja 2** y marcará el evento en verde en el Calendario Global.
